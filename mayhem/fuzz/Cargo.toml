[package]
name = "sui-mayhem-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The two upstream crates this target drives, reached by PATH — nothing upstream is edited.
# Deliberately WITHOUT the `fuzzing` feature: this target feeds the deserializer raw attacker
# bytes, so it needs no `Arbitrary` impls (that is what sui's own three targets use, and what
# pulls in proptest). Keeping the feature off also keeps this crate's dependency closure small.
[dependencies.move-binary-format]
path = "../../external-crates/move/crates/move-binary-format"

[dependencies.move-bytecode-verifier]
path = "../../external-crates/move/crates/move-bytecode-verifier"

# Deliberately its OWN workspace root (the empty-members table below), even though it lives
# inside the sui repo tree. sui's root Cargo.toml (an upstream file we never edit) is a real
# workspace that knows nothing about mayhem/fuzz; without this table cargo would walk up, find
# that workspace, and fail with "current package believes it's in a workspace when it's not".
# Being its own workspace ALSO decides where cargo-fuzz writes: this crate's binaries land under
# mayhem/fuzz/target/, whereas sui's own bytecode-verifier-libfuzzer crate IS a member of the
# external-crates/move workspace and its binaries land in external-crates/move/target/ (verified
# empirically — mayhem/build.sh asserts both paths so a wrong guess fails loudly).
# The path dependencies above still resolve their own `.workspace = true` manifest fields against
# the external-crates/move workspace, because cargo looks that up from EACH crate's own directory.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "deserialize_verify"
path = "fuzz_targets/deserialize_verify.rs"
test = false
doc = false
bench = false
